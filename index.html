<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23000'/%3E%3Cpath d='M24 72V28h12l14 20 14-20h12v44H64V49L50 68 36 49v23z' fill='%23fff'/%3E%3C/svg%3E">
<title>mario's net</title>
<style>
@font-face{font-family:Goldleaf;src:url("goldleaf-bold-font.ttf") format("truetype");font-style:normal;font-weight:700;font-display:swap}
*{box-sizing:border-box}
:root{--bg:#000;--panel:#0b0b0b;--panel2:#171717;--line:#2c2c2c;--text:#f2f2f2;--muted:#9a9a9a;--accent:#e5484d;--accent-ink:#000;--warn:#d8a35d;--ease:cubic-bezier(.2,.8,.2,1)}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;overflow-x:hidden;display:flex;justify-content:center;align-items:center;padding:24px;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);line-height:1.4}

#stars{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.star{position:absolute;width:2px;height:60px;background:linear-gradient(to bottom,transparent,rgba(255,255,255,.85));transform:rotate(45deg);animation:fall linear infinite;opacity:0}
@keyframes fall{0%{transform:translate(0,0) rotate(45deg);opacity:0}10%,85%{opacity:1}100%{transform:translate(-650px,650px) rotate(45deg);opacity:0}}

.box{position:relative;z-index:1;display:flex;gap:28px;width:fit-content;max-width:100%;padding:28px;border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.72);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.left{width:280px;flex-shrink:0;text-align:center;display:flex;flex-direction:column}
.pfp{width:100px;height:100px;object-fit:cover;border-radius:50%;border:2px solid var(--accent);margin:0 auto;cursor:pointer}
h1{font-family:Goldleaf,system-ui,sans-serif;font-size:24px;font-weight:700;margin:12px 0 4px;letter-spacing:.15px}
.tag{font-size:14px;color:var(--muted);margin:0 0 4px}
.socials{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.socials a,.socials button,.repos-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:0;font-size:13px;color:var(--text);text-decoration:none;border:1px solid var(--line);padding:9px 12px;border-radius:8px;background:var(--panel2);cursor:pointer;font-family:inherit;transition:background .15s,color .15s,border-color .15s}
.socials a:hover,.socials button:hover,.repos-btn:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.socials a:hover img,.socials button:hover img,.repos-btn:hover img{filter:invert(1)}
.socials img,.repos-btn img{width:14px;height:14px}
.right{width:580px;min-width:0;display:flex;flex-direction:column;gap:12px}
.panel{min-width:0;border:1px solid var(--line);background:rgba(0,0,0,.5);border-radius:10px;padding:14px}
.panel h3{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--accent)}
.lang-bar{display:flex;height:8px;width:100%;border-radius:999px;overflow:hidden;background:var(--line)}
.lang-legend{margin-top:10px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 12px;font-size:12px;color:var(--text)}
.lang-legend span{overflow-wrap:anywhere}
.lang-legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.repos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:240px;overflow-y:auto;padding-right:4px}
.repos::-webkit-scrollbar,.modal .list::-webkit-scrollbar,.term-body::-webkit-scrollbar{width:6px}
.repos::-webkit-scrollbar-thumb,.modal .list::-webkit-scrollbar-thumb,.term-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.repo{min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 11px;transition:border-color .15s,background-color .15s;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.repo:hover,.repo:focus-within{border-color:var(--accent);background:var(--panel2);transform:translateY(-2px)}
.repo-title-container{display:flex;align-items:center;gap:6px;margin-bottom:2px;min-width:0}
.repo a{color:var(--text);text-decoration:none;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.repo:hover a{color:var(--accent)}
.archive-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);flex-shrink:0}
.archive-badge{display:inline-block;align-self:flex-start;font-size:11px;color:var(--warn);border:1px solid var(--line);padding:1px 6px;border-radius:4px;margin-top:4px}
.repo .meta{margin-top:6px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lang-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle}
.muted{font-size:12px;color:var(--muted);grid-column:1/-1;overflow-wrap:anywhere}
.bottom{display:flex;justify-content:flex-end}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal-backdrop.open{display:flex}
.modal{width:min(720px,100%);max-height:90vh;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column}
.modal header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.modal h2{margin:0;font-size:17px;font-weight:600}
.modal .close{flex-shrink:0;background:var(--panel2);border:1px solid var(--line);color:var(--text);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px}
.modal .close:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.modal .list{overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:8px;padding-right:4px}

.auth-fields{display:grid;gap:8px;margin-bottom:10px}
.auth-fields input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--text);font-family:inherit;font-size:14px}
.auth-fields input:focus{outline:2px solid var(--accent);outline-offset:0}
.auth-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.auth-btns .muted{flex:1}
.auth-msg{color:var(--warn);min-height:16px}
#gameFrame{width:100%;height:62vh;border:0;border-radius:8px;background:var(--bg)}

/* Terminal window: drag the title bar, resize from the bottom-right corner */
.term{animation:term-in .22s var(--ease) both;position:fixed;top:80px;left:20px;width:min(560px,94vw);height:320px;min-width:260px;min-height:160px;max-width:100vw;max-height:100vh;display:flex;flex-direction:column;resize:both;overflow:hidden;z-index:20;background:#050505;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 36px rgba(0,0,0,.5)}
.term-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;background:var(--panel2);border-bottom:1px solid var(--line);cursor:move;user-select:none;touch-action:none;font-size:13px;color:var(--muted)}
.term-bar button{background:none;border:0;color:var(--muted);font-size:16px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:4px}
.term-bar button:hover{background:var(--line);color:var(--text)}
.term-body{flex:1;overflow-y:auto;padding:10px 12px;font:13px/1.5 ui-monospace,Consolas,"Courier New",monospace;color:#d6dbe0;cursor:text}
.term-body div{white-space:pre-wrap;overflow-wrap:anywhere}
.term-line{display:flex;gap:8px}
.term-line span{color:var(--accent);white-space:nowrap}
.term-line span.root{color:var(--warn)}
.term-line input{flex:1;min-width:0;background:none;border:0;outline:0;color:inherit;font:inherit}
.term-line input:disabled::placeholder{color:var(--muted)}
.term-auth{flex-shrink:0;max-height:75%;overflow-y:auto;padding:12px;border-bottom:1px solid var(--line)}
.term-auth .note{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--text)}
.term-auth .auth-fields{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.term-auth .auth-btns{margin-bottom:6px}
.term-auth .auth-msg{margin:0}
.term.locked{height:min(400px,92vh)}


.ps{color:var(--accent)}

/* KaivoraOS — polished boot screen and desktop */
#kos{position:fixed;inset:0;z-index:30;background:#080b12;color:#f5f7ff;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif}
#kosBoot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:radial-gradient(ellipse at 50% 42%,rgba(229,72,77,.20),transparent 42%),linear-gradient(145deg,#111522,#07080d 65%)}
.kos-logo{font-family:Goldleaf,"Segoe UI",system-ui,sans-serif;font-size:clamp(38px,6vw,64px);font-weight:700;letter-spacing:0;text-shadow:0 2px 24px rgba(213,170,83,.16);color:#d8b56d}
.kos-logo b,.kos-start b{color:inherit;font:inherit}
.kos-bar{width:min(240px,60vw);height:4px;background:rgba(255,255,255,.12);border-radius:20px;overflow:hidden}
.kos-bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#e5484d,#ff9298);box-shadow:0 0 16px rgba(229,72,77,.65);animation:kosload 1.6s ease-out forwards}
@keyframes kosload{to{width:100%}}
#kosDesktop{position:absolute;inset:0;background-color:#10131b;background-position:center;background-size:cover;background-repeat:no-repeat}
.kos-icons{position:absolute;top:14px;left:14px;display:grid;gap:10px;grid-auto-rows:84px}
.kos-icon{width:84px;height:84px;background:rgba(12,14,21,.10);border:1px solid transparent;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:12px;cursor:pointer;font:inherit;font-size:12px;text-shadow:0 1px 4px #000;transition:background .18s,border-color .18s}
.kos-icon span{font-size:30px;line-height:1}

.kos-icon:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12)}
.kos-icon:active,.kos-task:active,.kos-start:active{transform:scale(.97)}
/* Vector app icons: no emoji glyphs */
.kos-appmark{width:42px;height:42px;display:grid;place-items:center;border-radius:10px;box-shadow:none;flex-shrink:0}
.kos-appmark svg{width:25px;height:25px;display:block}
.kos-icon .kos-appmark{width:46px;height:46px;border-radius:14px}
.kos-icon .kos-appmark svg{width:28px;height:28px}
.kos-appmark.games{background:#343b50;color:#dce3f5}
.kos-appmark.settings{background:#343a42;color:#e0e5eb}
.kos-appmark.kalu{background:#a66b2c;color:#fff0d9}
.kalu-browser{height:100%;min-height:0;display:flex;flex-direction:column;background:#f6f7f9;color:#17191d}
.kalu-toolbar{display:flex;gap:7px;align-items:center;padding:10px;background:#fff;border-bottom:1px solid #e1e4e8;flex-wrap:wrap}
.kalu-brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;color:#20242a;margin-right:5px}
.kalu-brand .kos-appmark{width:32px;height:32px;border-radius:9px}
.kalu-address{flex:1;min-width:130px;border:1px solid #d6dae0;background:#f5f6f8;border-radius:9px;padding:10px 12px;font:13px system-ui;color:#20242a;outline:none}
.kalu-address:focus{border-color:#e58a2c;box-shadow:0 0 0 3px #e58a2c25}
.kalu-btn{border:1px solid #d6dae0;background:#fff;border-radius:9px;padding:9px 12px;cursor:pointer;color:#252a31;font:600 12px system-ui}
.kalu-btn:hover{background:#f0f2f5;transform:translateY(-1px)}
.kalu-bookmarks{display:flex;gap:8px;flex-wrap:wrap;padding:10px;background:#fff;border-bottom:1px solid #e1e4e8}
.kalu-bookmark{display:flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid #e1e4e8;background:#fff;border-radius:10px;cursor:pointer;font:600 12px system-ui;color:#262a30}
.kalu-bookmark:hover{background:#f4f5f7;border-color:#c7ccd4}
.kalu-siteicon{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;color:#fff;font:800 12px system-ui}
.kalu-view{border:0;flex:1;min-height:180px;width:100%;background:#fff}
.kalu-home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:30px;text-align:center;background:radial-gradient(ellipse at 50% 40%,#fff 0,#f6f7f9 68%)}
.kalu-home h2{font-size:clamp(30px,5vw,48px);letter-spacing:-2px;margin:0;color:#242832}
.kalu-home h2 span{color:#e58a2c}
.kalu-home p{margin:0;color:#737b86;font-size:13px}
.kalu-searchform{display:flex;width:min(560px,100%);gap:8px}
.kalu-searchform input{flex:1;min-width:0;border:1px solid #d8dce2;background:#fff;border-radius:12px;padding:14px 16px;font:14px system-ui;outline:none;box-shadow:0 5px 20px #17191d0a}
.kalu-searchform input:focus{border-color:#e58a2c}
.kalu-status{font-size:11px;color:#7a818c;padding:6px 11px;background:#fff;border-top:1px solid #e1e4e8}
@media(max-width:520px){.kalu-toolbar{gap:5px;padding:7px}.kalu-brand{font-size:15px}.kalu-btn{padding:8px}.kalu-bookmarks{gap:5px;padding:7px}.kalu-bookmark{padding:6px 8px}}

#kosWindows{position:absolute;inset:0 0 68px 0;pointer-events:none}
.kos-win{animation:window-in .2s var(--ease) both;pointer-events:auto;position:absolute;display:flex;flex-direction:column;background:rgba(17,19,27,.96);border:1px solid rgba(255,255,255,.14);border-radius:12px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.5);backdrop-filter:blur(18px)}
.kos-win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
.kos-wbar{display:flex;align-items:center;gap:6px;padding:9px 12px;background:rgba(255,255,255,.045);border-bottom:1px solid rgba(255,255,255,.09);cursor:move;user-select:none;touch-action:none;font-size:13px}
.kos-wtitle{flex:1}
.kos-wbar button{background:none;border:0;color:#b6bac7;font-size:15px;line-height:1;cursor:pointer;padding:3px 7px;border-radius:5px}
.kos-wbar button:hover{background:rgba(255,255,255,.12);color:#fff}
.kos-wbody{flex:1;min-height:0;overflow:auto;position:relative}
.kos-taskbar{position:absolute;left:12px;right:12px;bottom:10px;height:48px;display:flex;align-items:center;gap:10px;padding:0 12px;background:rgba(12,14,21,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.10);border-radius:10px;box-shadow:0 5px 18px rgba(0,0,0,.22)}
.kos-start,.kos-task{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.10);color:#f5f7ff;border-radius:8px;padding:8px 13px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .18s,border-color .18s}
.kos-start{font-family:Goldleaf,"Segoe UI",system-ui,sans-serif;color:#d8b56d;font-weight:700;letter-spacing:0}
.kos-start:hover,.kos-task:hover,.kos-task.active{background:rgba(229,72,77,.16);border-color:rgba(255,98,107,.65)}
#kosTasks{display:flex;gap:6px;flex:1;overflow-x:auto;min-width:0}
.kos-who,.kos-clock{font-size:12px;color:#c4c8d4;white-space:nowrap}
.kos-menu{position:absolute;left:12px;bottom:68px;width:230px;background:rgba(17,19,27,.96);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:7px;box-shadow:0 18px 50px rgba(0,0,0,.45);backdrop-filter:blur(22px)}
.kos-mi{display:block;width:100%;text-align:left;background:none;border:0;color:#f5f7ff;font:inherit;font-size:14px;padding:10px 12px;border-radius:8px;cursor:pointer}
.kos-mi:hover{background:rgba(255,255,255,.09)}
.kos-sep{height:1px;background:rgba(255,255,255,.12);margin:6px 4px}

.kos-task .kos-appmark{display:inline-grid;vertical-align:middle;width:22px;height:22px;border-radius:6px;box-shadow:none}.kos-task .kos-appmark svg{width:15px;height:15px}.kos-wtitle .kos-appmark{width:23px;height:23px;border-radius:6px;box-shadow:none}.kos-wtitle .kos-appmark svg{width:15px;height:15px}.kos-mi .kos-appmark{width:28px;height:28px;border-radius:8px;box-shadow:none}.kos-mi .kos-appmark svg{width:17px;height:17px}
/* Games library */
.lib{display:flex;height:100%;min-height:0}
.lib-side{width:230px;flex-shrink:0;display:flex;flex-direction:column;background:var(--bg);border-right:1px solid var(--line)}
.lib-search{margin:10px;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);font:inherit;font-size:13px}
.lib-label{padding:2px 14px 6px;font-size:11px;letter-spacing:.5px;color:var(--muted)}
.lib-list{flex:1;overflow-y:auto}
.lib-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 14px;background:none;border:0;color:var(--text);font:inherit;font-size:14px;text-align:left;cursor:pointer}
.lib-item:hover{background:var(--panel2)}
.lib-item.sel{background:var(--panel2);box-shadow:inset 3px 0 var(--accent)}
.lib-tile{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.lib-main{flex:1;min-width:0;display:flex;flex-direction:column}
.lib-hero{height:170px;flex-shrink:0;display:flex;align-items:flex-end;padding:18px 22px;font-size:28px;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.lib-bar{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:14px 22px;background:var(--panel2);border-bottom:1px solid var(--line)}
.lib-play{background:var(--accent);color:#000;border:0;border-radius:8px;padding:10px 26px;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.lib-play:hover{filter:brightness(1.1);transform:translateY(-1px)}
.lib-stat{display:flex;flex-direction:column;font-size:11px;color:var(--muted)}
.lib-stat b{font-size:13px;color:var(--text);font-weight:600}
.lib-desc{padding:16px 22px;font-size:14px;color:var(--muted);overflow-y:auto}
.lib-area{flex:1;min-height:0;display:flex;flex-direction:column}
.lib-area iframe{flex:1;min-height:0;width:100%;border:0;background:#000}
.lib-gname{font-weight:600;flex:1}

/* Settings */
.kos-settings{padding:16px 18px;display:grid;gap:10px;align-content:start;animation:content-in .22s var(--ease) both}
.kos-settings h4{margin:8px 0 0;font-size:13px;color:var(--accent)}
.kos-settings label{font-size:12px;color:var(--muted)}
.kos-field{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--text);font:inherit;font-size:14px}
.kos-field:focus,.lib-search:focus{outline:2px solid var(--accent);outline-offset:0}
.kos-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kos-prev{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px}
.kos-prev img{width:16px;height:16px}
.kos-settings input[type=file]{font-size:12px;color:var(--muted);max-width:100%}
@media (max-width:640px){.lib{flex-direction:column}.lib-side{width:100%;max-height:36%;border-right:0;border-bottom:1px solid var(--line)}.lib-hero{height:110px;font-size:22px}}
@media (max-width:1000px){body{align-items:flex-start;padding:20px}.box{flex-direction:column;width:min(580px,100%);gap:20px;padding:20px}.left,.right{width:100%}.right{min-height:360px}}
@media (max-width:420px){body{padding:12px}.box{padding:14px}.repos{grid-template-columns:1fr}.lang-legend{grid-template-columns:repeat(2,minmax(0,1fr))}}
@keyframes window-in{from{opacity:0;transform:translateY(9px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes term-in{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes content-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.star{animation:none;display:none}*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

/* KaivoraOS visual pass: one restrained design system, no fake-glass overload */
:root{--kos-gold:#d8b56d;--kos-gold-soft:#a98b50;--kos-bg:#101113;--kos-panel:#18191c;--kos-line:#303136;--kos-muted:#a5a5a8;--kos-text:#eeeae1}
#kos{background:var(--kos-bg);color:var(--kos-text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;isolation:isolate}
#kosBoot{background:#101113;gap:22px}

<script>
/* ===== Configuration ===== */
const GH_USER = 'mariocrazyy';
const DISCORD_HANDLE = 'marioo.crazy';
const SECRET_CODE = 'kaivoraos';

// Add your games here. "file" is the path to each game's .html file.
const GAMES = [
  { id: 'game1', name: 'Game 1', file: 'games/game1.html' }
  // { id: 'snake', name: 'Snake', file: 'games/snake.html' },
];

const LANG_COLORS = {JavaScript:'#f1e05a',TypeScript:'#3178c6',Python:'#3572A5',HTML:'#e34c26',CSS:'#563d7c',Java:'#b07219','C++':'#f34b7d',Lua:'#4a6cd4',Shell:'#89e051',Rust:'#dea584',Go:'#00ADD8',PHP:'#4F5D95',C:'#555555','C#':'#178600',Kotlin:'#A97BFF',Swift:'#F05138',Ruby:'#701516'};
const langColor = n => LANG_COLORS[n] || '#8b98a5';

/* ===== Shooting stars ===== */
(function () {
  const root = document.getElementById('stars');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (let i = 0; i < 85; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = (Math.random() * 150 - 20) + 'vw';
    s.style.top = (Math.random() * 140 - 40) + 'vh';
    s.style.height = (40 + Math.random() * 50) + 'px';
    s.style.animationDuration = (4 + Math.random() * 5) + 's';
    s.style.animationDelay = (Math.random() * -10) + 's';
    root.appendChild(s);
  }
})();

/* ===== Discord copy ===== */
document.getElementById('discordBtn').addEventListener('click', async function () {
  const b = this, old = b.innerHTML;
  try { await navigator.clipboard.writeText(DISCORD_HANDLE); b.textContent = 'Copied!'; }
  catch { b.textContent = DISCORD_HANDLE; }
  setTimeout(() => { b.innerHTML = old; }, 1500);
});

/* ===== GitHub data (cached for 1 hour to avoid API rate limits) ===== */
async function cached(key, loader) {
  try {
    const c = JSON.parse(localStorage.getItem(key));
    if (c && Date.now() - c.t < 3600000) return c.v;
  } catch {}
  try {
    const v = await loader();
    try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), v })); } catch {}
    return v;
  } catch (err) {
    try { const c = JSON.parse(localStorage.getItem(key)); if (c) return c.v; } catch {}
    throw err;
  }
}

async function fetchRepos() {
  const repos = await cached('mn_repos', async () => {
    const r = await fetch(`https://api.github.com/users/${GH_USER}/repos?per_page=100&sort=updated`);
    if (!r.ok) throw new Error('GitHub request failed: ' + r.status);
    return r.json();
  });
  return repos.filter(r => !['mariocrazyy.github.io', 'mariocrazyy'].includes(r.name.toLowerCase()));
}

async function fetchLanguages(repos) {
  return cached('mn_langs', async () => {
    const totals = {};
    const results = await Promise.allSettled(
      repos.filter(r => !r.fork).map(async r => {
        const res = await fetch(r.languages_url);
        return res.ok ? res.json() : {};
      })
    );
    for (const res of results) {
      if (res.status !== 'fulfilled') continue;
      for (const [l, b] of Object.entries(res.value)) totals[l] = (totals[l] || 0) + b;
    }
    return totals;
  });
}

function note(text) {
  const p = document.createElement('p');
  p.className = 'muted';
  p.textContent = text;
  return p;
}

function renderLanguages(totals) {
  const c = document.getElementById('langContent');
  const total = Object.values(totals).reduce((s, b) => s + b, 0);
  if (!total) return c.replaceChildren(note('No language data available.'));

  const top = Object.entries(totals).sort((a, b) => b[1] - a[1]).slice(0, 6)
    .map(([name, bytes]) => ({ name, pct: bytes / total * 100 }));
  const bar = document.createElement('div'); bar.className = 'lang-bar';
  const legend = document.createElement('div'); legend.className = 'lang-legend';

  for (const l of top) {
    const seg = document.createElement('div');
    seg.title = `${l.name}: ${l.pct.toFixed(1)}%`;
    seg.style.width = l.pct + '%';
    seg.style.backgroundColor = langColor(l.name);
    bar.appendChild(seg);

    const item = document.createElement('span');
    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.backgroundColor = langColor(l.name);
    item.append(dot, document.createTextNode(`${l.name} ${l.pct.toFixed(1)}%`));
    legend.appendChild(item);
  }
  c.replaceChildren(bar, legend);
}

function repoCard(repo) {
  const card = document.createElement('div');
  card.className = 'repo';
  const details = document.createElement('div');
  const tc = document.createElement('div');
  tc.className = 'repo-title-container';

  if (repo.archived) {
    const d = document.createElement('span');
    d.className = 'archive-dot'; d.title = 'Archived';
    tc.appendChild(d);
  }

/* ===== Local accounts (stored in this browser) ===== */
const DB_KEY = 'mn_users', SESSION_KEY = 'mn_session';
let user = null;      // { name } when logged in
let guest = false;
let currentGame = null;

function loadDB() { try { return JSON.parse(localStorage.getItem(DB_KEY)) || {}; } catch { return {}; } }
function saveDB(db) { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
const validName = n => /^[a-z0-9_]{3,20}$/.test(n);

async function hashPass(name, pass) {
  if (!crypto.subtle) return btoa(unescape(encodeURIComponent(name + ':' + pass)));
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(name + ':' + pass));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

async function authCore(name, pass, isRegister) {
  name = name.trim().toLowerCase();
  if (!validName(name)) return 'Name: 3-20 characters, letters, numbers or _';
  if (pass.length < 4) return 'Password must be at least 4 characters';
  const db = loadDB();
  const h = await hashPass(name, pass);
  if (isRegister) {
    if (db[name]) return 'Name already taken';
    db[name] = { hash: h, saves: {} };
    saveDB(db);
  } else if (!db[name] || db[name].hash !== h) {
    return 'Wrong name or password';
  }
  user = { name };
  guest = false;
  sessionStorage.setItem(SESSION_KEY, name);
  return null;
}

localStorage.removeItem(SESSION_KEY); // clean up old always-logged-in sessions
/* Leaving the site logs you out: on close/refresh/navigating away (pagehide), and
   also when a phone restores an old tab (no "heartbeat" for more than 20 seconds). */
const SEEN_KEY = 'mn_seen';
const beat = () => { try { sessionStorage.setItem(SEEN_KEY, String(Date.now())); } catch {} };
const savedSession = sessionStorage.getItem(SESSION_KEY);
const lastSeen = Number(sessionStorage.getItem(SEEN_KEY)) || 0;
if (savedSession && Date.now() - lastSeen > 20000) sessionStorage.removeItem(SESSION_KEY);
else if (savedSession && loadDB()[savedSession]) user = { name: savedSession };
beat();
setInterval(beat, 5000);

function leaveSite() {
  sessionStorage.removeItem(SESSION_KEY);
  user = null; guest = false;
}
window.addEventListener('pagehide', leaveSite);
window.addEventListener('pageshow', e => {
  if (!e.persisted) return;
  leaveSite();
  if (typeof kosOpen !== 'undefined' && kosOpen) shutdownOS();
});

/* Games inside KaivoraOS talk to the site with postMessage:
   parent.postMessage({type:'ready'}) when they start, and
   parent.postMessage({type:'save', data:{...}}) to save progress. */
let osGameFrame = null, osCurrentGame = null;
window.addEventListener('message', e => {
  if (!osGameFrame || e.source !== osGameFrame.contentWindow || !osCurrentGame) return;
  const d = e.data || {};
  if (d.type === 'ready') {
    const saved = user ? (loadDB()[user.name]?.saves[osCurrentGame.id] ?? null) : null;
    osGameFrame.contentWindow.postMessage({ type: 'load', data: saved }, '*');
  }
  if (d.type === 'save' && user) {
    const db = loadDB();
    if (db[user.name]) { db[user.name].saves[osCurrentGame.id] = d.data; saveDB(db); }
  }
});

function setFavicon(href) {
  document.querySelectorAll('link[rel~="icon"]').forEach(l => l.remove());
  if (!href) return;
  const l = document.createElement('link');
  l.rel = 'icon'; l.href = href;
  document.head.appendChild(l);
}
function emojiIcon(ch) {
  const c = ch.replace(/[<>&"']/g, '');
  return 'data:image/svg+xml,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">' + c + '</text></svg>');
}
function fileToIcon(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = c.height = 64;
        const side = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 64, 64);
        res(c.toDataURL('image/png'));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
function applyTab() {
  const t = loadTab();
  document.title = t.title || DEFAULT_TITLE;

function buildGames(body) {
  const lib = mk('div', 'lib');
  const side = mk('div', 'lib-side');

  search.placeholder = 'Search games';

  const list = mk('div', 'lib-list');
  const main = mk('div', 'lib-main');
  side.append(search, label, list);
  lib.append(side, main);
  body.append(lib);

  let selected = GAMES[0] || null, playing = null, startedAt = 0;
  const hue = name => { let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; };

  function renderList() {
    list.replaceChildren();
    const q = search.value.trim().toLowerCase();
    const shown = GAMES.filter(g => g.name.toLowerCase().includes(q));
    label.textContent = 'ALL GAMES (' + shown.length + ')';
    if (!shown.length) { list.appendChild(note('No games found.')); return; }
    for (const g of shown) {
      const b = mk('button', 'lib-item' + (g === selected ? ' sel' : ''));
      const tile = mk('span', 'lib-tile', g.name.charAt(0).toUpperCase());
      tile.style.background = 'hsl(' + hue(g.name) + ' 40% 28%)';
      b.append(tile, document.createTextNode(g.name));
      b.onclick = () => { if (playing) stop(); selected = g; renderList(); renderMain(); };
      list.appendChild(b);
    }
  }

  function renderMain() {
    main.replaceChildren();
    if (!selected) { main.appendChild(note('No games yet. Add some to the GAMES list in index.html.')); return; }
    const g = selected, st = getStat(g.id);
    const hero = mk('div', 'lib-hero', g.name);
    hero.style.background = g.cover
      ? "url('" + g.cover + "') center/cover"
      : 'linear-gradient(135deg,hsl(' + hue(g.name) + ' 45% 26%),hsl(' + hue(g.name) + ' 40% 8%))';
    const bar = mk('div', 'lib-bar');
    const play = mk('button', 'lib-play', '▶ PLAY');
    play.onclick = start;
    const stat = (k, v) => { const d = mk('div', 'lib-stat', k); d.appendChild(mk('b', '', v)); return d; };
    const saved = user ? (loadDB()[user.name]?.saves[g.id] ? 'Saved' : 'No save yet') : 'Guest (not saved)';
    bar.append(play,
      stat('LAST PLAYED', st.last ? new Date(st.last).toLocaleDateString() : 'Never'),
      stat('PLAY TIME', fmtTime(st.ms)),
      stat('PROGRESS', saved));
    main.append(hero, bar, mk('div', 'lib-desc', g.desc || 'No description yet.'));
  }

  function start() {
    playing = selected; startedAt = Date.now(); osCurrentGame = selected;
    main.replaceChildren();
    const bar = mk('div', 'lib-bar');
    const stopBtn = mk('button', 'repos-btn', '■ Stop');
    stopBtn.onclick = stop;
    const frame = document.createElement('iframe');
    frame.title = selected.name;
    frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-pointer-lock');
    frame.src = selected.file;
    osGameFrame = frame;
    const full = mk('button', 'repos-btn', 'Fullscreen');
    full.onclick = () => { if (frame.requestFullscreen) frame.requestFullscreen(); };
    bar.append(mk('span', 'lib-gname', selected.name), full, stopBtn);
    const area = mk('div', 'lib-area');
    area.append(bar, frame);
    main.append(area);
  }

  function finish() {
    if (!playing) return;
    addPlay(playing.id, Date.now() - startedAt);
    playing = null; osGameFrame = null; osCurrentGame = null;
  }
  function stop() { finish(); renderMain(); }

  search.addEventListener('input', renderList);
  renderList(); renderMain();
  return finish; // runs when the window is closed
}

  view.title = 'Kalu browser page';
  view.referrerPolicy = 'strict-origin-when-cross-origin';
  view.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
  const home = mk('div', 'kalu-home');
  const heading = document.createElement('h2'); heading.innerHTML = 'Search with <span>DuckDuckGo</span>';
  const subtitle = mk('p', '', 'Browse in this window. Media links are embedded when the site supports it.');
  const form = mk('form', 'kalu-searchform');
  const query = mk('input'); query.placeholder = 'Search the web…'; query.setAttribute('aria-label', 'DuckDuckGo search');
  const searchBtn = mk('button', 'kalu-btn', 'Search'); searchBtn.type = 'submit';
  form.append(query, searchBtn); home.append(heading, subtitle, form);
  const notice = mk('div', 'kalu-home');
  notice.hidden = true;
  const status = mk('div', 'kalu-status', 'Kalu · Search or enter a URL. Pages that prohibit embedding cannot be forced to load by GitHub Pages.');
  root.append(toolbar, bookmarks, home, view, notice, status); body.append(root);
  view.hidden = true;

  let history = [], historyIndex = -1, currentUrl = 'https://html.duckduckgo.com/html/';
  function normalize(raw) {
    const value = String(raw || '').trim();
    if (!value) return 'https://html.duckduckgo.com/html/';
    if (/^(javascript|data|file|vbscript):/i.test(value)) return 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(value);
    if (/^https?:\/\//i.test(value)) {
      try { const u = new URL(value); return ['http:','https:'].includes(u.protocol) ? u.href : 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(value); }
      catch { return 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(value); }
    }
    const host = !/\s/.test(value) && (/^(localhost|\d{1,3}(?:\.\d{1,3}){3})(:\d{1,5})?(\/.*)?$/i.test(value) || /^(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}(?::\d{1,5})?(?:\/[^\s]*)?$/i.test(value));
    return host ? 'https://' + value : 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(value);
  }
  function internalNotice(title, message, link) {
    view.hidden = true; home.hidden = true; notice.hidden = false; notice.replaceChildren();
    const h = document.createElement('h2'); h.textContent = title;
    const p = mk('p', '', message);
    notice.append(h, p);
    if (link) {
      const a = document.createElement('a'); a.href = link; a.textContent = 'Copy link';
      a.style.cssText = 'color:#d64a6c;cursor:pointer;text-decoration:underline';
      a.addEventListener('click', async e => { e.preventDefault(); try { await navigator.clipboard.writeText(link); status.textContent = 'Link copied. Paste it into Kalu or another allowed page.'; } catch { address.value = link; status.textContent = 'Link is in the address bar.'; } });
      notice.append(a);
    }
  }
  function getDisplay(raw) {
    let u;
    try { u = new URL(raw); } catch { return { url: raw }; }
    const host = u.hostname.toLowerCase().replace(/^www\./, '');
    if (host === 'youtube.com' || host === 'm.youtube.com' || host === 'youtu.be' || host === 'youtube-nocookie.com') {
      let id = u.searchParams.get('v');
      const parts = u.pathname.split('/').filter(Boolean);
      if (host === 'youtu.be') id = parts[0];
      if (['shorts','embed','live'].includes(parts[0])) id = parts[1];
      if (id && /^[a-zA-Z0-9_-]{6,20}$/.test(id)) return { url: 'https://www.youtube-nocookie.com/embed/' + id, label: 'YouTube video embed' };
      return { notice: true, title: 'YouTube', message: 'YouTube’s full homepage may refuse to load inside a GitHub Pages iframe. Try opening a direct video link; Kalu will convert it to an embedded player.', link: raw };
    }
    if (host === 'open.spotify.com') {
      const parts = u.pathname.split('/').filter(Boolean);
      if (parts[0] === 'embed') return { url: raw };
      if (['track','album','playlist','episode','show','artist'].includes(parts[0]) && parts[1]) return { url: 'https://open.spotify.com/embed/' + parts[0] + '/' + encodeURIComponent(parts[1]), label: 'Spotify player embed' };
      return { notice: true, title: 'Spotify', message: 'The full Spotify website is not designed to run inside every iframe. Open a track, album, or playlist URL in Kalu to show its embedded player.', link: raw };
    }
    if (host === 'discord.com' || host === 'discordapp.com') {
      return { notice: true, title: 'Discord cannot be embedded here', message: 'Discord blocks its full app from loading inside ordinary website iframes. GitHub Pages cannot remove that restriction, and Kalu will keep you on this page instead of opening a new tab.', link: raw };
    }
    if (host === 'tiktok.com') {
      const match = u.pathname.match(/\/@[^/]+\/video\/(\d+)/);
      if (match) return { url: 'https://www.tiktok.com/embed/v2/' + match[1], label: 'TikTok video embed' };
      return { notice: true, title: 'TikTok', message: 'TikTok’s full feed may block iframe embedding. Try a direct video URL; Kalu will attempt to load the video player inside this window.', link: raw };
    }
    return { url: raw };
  }
  function navigate(raw, push=true) {
    const url = normalize(raw); currentUrl = url; address.value = url;
    const display = getDisplay(url);
    if (push) { history = history.slice(0, historyIndex + 1); history.push(url); historyIndex = history.length - 1; }
    back.disabled = historyIndex <= 0; forward.disabled = historyIndex >= history.length - 1;
    if (display.notice) {
      internalNotice(display.title, display.message, display.link);
      status.textContent = display.title + ' · staying inside Kalu';
      return;
    }
    notice.hidden = true; home.hidden = true; view.hidden = false;
    view.src = display.url;
    status.textContent = (display.label ? display.label + ' · ' : 'Loading inside Kalu: ') + url;
  }
  go.onclick = () => navigate(address.value);
  address.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); navigate(address.value); } });
  form.addEventListener('submit', e => { e.preventDefault(); if (query.value.trim()) navigate('https://html.duckduckgo.com/html/?q=' + encodeURIComponent(query.value.trim())); });
  back.onclick = () => { if (historyIndex > 0) { historyIndex--; navigate(history[historyIndex], false); } };
  forward.onclick = () => { if (historyIndex < history.length - 1) { historyIndex++; navigate(history[historyIndex], false); } };
  reload.onclick = () => { if (historyIndex < 0) navigate(currentUrl, false); else navigate(currentUrl, false); if (!view.hidden) view.src = view.src; };
  for (const site of sites) {
    const b = mk('button', 'kalu-bookmark');
    const icon = mk('span', 'kalu-siteicon', site.letter); icon.style.background = site.color;
    b.append(icon, document.createTextNode(site.name)); b.title = 'Open ' + site.name;
    b.onclick = () => navigate(site.url);
    bookmarks.appendChild(b);
  }
  return null;
}

const APP_SVGS = {
  games: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8h10a4 4 0 0 1 3.8 5.2l-1 3.1a2 2 0 0 1-3.3.8L14 14H10l-2.5 3.1a2 2 0 0 1-3.3-.8l-1-3.1A4 4 0 0 1 7 8Z"/><path d="M7 10v4M5 12h4M16.5 11.5h.01M18.5 13.5h.01"/></svg>',
  settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8.1a3.9 3.9 0 1 0 0 7.8 3.9 3.9 0 0 0 0-7.8Z"/><path d="m19.4 13.5 1.1.9-1.2 2.1-1.4-.5a7.9 7.9 0 0 1-1.6.9l-.2 1.5h-2.4l-.3-1.5a7.9 7.9 0 0 1-1.6-.9l-1.4.5-1.2-2.1 1.1-.9a7.5 7.5 0 0 1 0-1.8l-1.1-.9 1.2-2.1 1.4.5a7.9 7.9 0 0 1 1.6-.9l.3-1.5h2.4l.2 1.5a7.9 7.9 0 0 1 1.6.9l1.4-.5 1.2 2.1-1.1.9a7.5 7.5 0 0 1 0 1.8Z"/></svg>',
  kalu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>'
};
function appMark(id) {

const APPS = {

/* --- windows --- */
function focusWin(id) {
  const w = kosWins[id];
  if (!w) return;
  w.el.style.zIndex = ++zTop;
  for (const [k, v] of Object.entries(kosWins)) v.task.classList.toggle('active', k === id);
}
function closeWin(id) {
  const w = kosWins[id];
  if (!w) return;
  if (w.onClose) w.onClose();
  w.el.remove(); w.task.remove();
  delete kosWins[id];
}
function openApp(id) {
  kosMenu.hidden = true;
  if (kosWins[id]) { focusWin(id); return; }
  const app = APPS[id];
  const n = Object.keys(kosWins).length;
  const el = mk('div', 'kos-win');
  const w = Math.min(app.w, innerWidth - 16), h = Math.min(app.h, innerHeight - 70);
  el.style.width = w + 'px'; el.style.height = h + 'px';
  el.style.left = Math.max(8, (innerWidth - w) / 2 + n * 26) + 'px';
  el.style.top = Math.max(8, (innerHeight - 44 - h) / 2 + n * 26) + 'px';
  if (innerWidth < 700) el.classList.add('max');

  const bar = mk('div', 'kos-wbar');
  const maxBtn = mk('button', '', '▢'); maxBtn.title = 'Maximize';
  const closeBtn = mk('button', '', '×'); closeBtn.title = 'Close';
  const winTitle = mk('span', 'kos-wtitle'); winTitle.append(appMark(app.icon), document.createTextNode(' ' + app.title));
  winTitle.style.display = 'flex'; winTitle.style.alignItems = 'center'; winTitle.style.gap = '8px';
  bar.append(winTitle, maxBtn, closeBtn);
  const body = mk('div', 'kos-wbody');
  el.append(bar, body);
  kosWindows.appendChild(el);

  const task = mk('button', 'kos-task');
  task.append(appMark(app.icon), document.createTextNode(' ' + app.title));
  task.onclick = () => focusWin(id);
  kosTasks.appendChild(task);
  kosWins[id] = { el, task, onClose: null };
  kosWins[id].onClose = app.build(body) || null;

  maxBtn.onclick = () => el.classList.toggle('max');
  closeBtn.onclick = () => closeWin(id);
  el.addEventListener('pointerdown', () => focusWin(id));

  let d = null;
  bar.addEventListener('pointerdown', e => {
    if (e.target.closest('button') || el.classList.contains('max')) return;
    const r = el.getBoundingClientRect();
    d = { dx: e.clientX - r.left, dy: e.clientY - r.top, lastX: e.clientX, lastY: e.clientY, lastT: performance.now(), vx: 0, vy: 0, angle: 0 };
    el.classList.remove('kos-wiggle-release');
    el.classList.add('wiggling');
    el.style.setProperty('--release-angle', '0deg');
    el.style.transition = 'none';
    bar.setPointerCapture(e.pointerId);
  });
  bar.addEventListener('pointermove', e => {
    if (!d) return;
    const now = performance.now();
    const dt = Math.max(1, now - d.lastT);
    const dx = e.clientX - d.lastX;
    const dy = e.clientY - d.lastY;
    // Smoothed pointer velocity gives the elastic, physics-driven Linux-style wobble.
    d.vx = d.vx * 0.42 + (dx / dt) * 0.58;
    d.vy = d.vy * 0.42 + (dy / dt) * 0.58;
    d.lastX = e.clientX; d.lastY = e.clientY; d.lastT = now;
    d.angle = Math.max(-8, Math.min(8, d.vx * 2.6));
    const lean = Math.max(-3, Math.min(3, d.vy * 0.6));
    el.style.transform = `perspective(900px) rotate(${d.angle}deg) skewY(${lean}deg) scale(1.012, .992)`;
    el.style.left = Math.min(Math.max(0, e.clientX - d.dx), kosWindows.clientWidth - 80) + 'px';
    el.style.top = Math.min(Math.max(0, e.clientY - d.dy), kosWindows.clientHeight - 36) + 'px';
  });
  function endWindowDrag() {
    if (!d) return;
    const angle = d.angle || 0;
    d = null;
    el.style.setProperty('--release-angle', angle + 'deg');
    el.style.transition = '';
    el.style.transform = '';
    el.classList.remove('wiggling');
    el.classList.add('kos-wiggle-release');
    window.setTimeout(() => { el.classList.remove('kos-wiggle-release'); el.style.removeProperty('--release-angle'); }, 520);
  }
  bar.addEventListener('pointerup', endWindowDrag);
  bar.addEventListener('pointercancel', endWindowDrag);
  focusWin(id);
}

/* --- desktop icons, start menu, boot and shut down --- */
function menuItem(text, fn) {
  const b = mk('button', 'kos-mi', text);
  b.onclick = () => { kosMenu.hidden = true; fn(); };

}
for (const [id, app] of Object.entries(APPS)) {
  const ic = mk('button', 'kos-icon');

  ic.onclick = () => openApp(id);
  document.getElementById('kosIcons').appendChild(ic);
  const mi = mk('button', 'kos-mi'); mi.append(appMark(app.icon), document.createTextNode('  ' + app.title)); mi.style.display = 'flex'; mi.style.alignItems = 'center'; mi.style.gap = '10px'; mi.onclick = () => { kosMenu.hidden = true; openApp(id); }; kosMenu.appendChild(mi);
}
kosMenu.appendChild(mk('div', 'kos-sep'));
menuItem('Log out', () => kosLogout());
menuItem('Shut down', () => shutdownOS());

document.getElementById('kosStart').onclick = () => { kosMenu.hidden = !kosMenu.hidden; };
kosDesktop.addEventListener('pointerdown', e => {
  if (!e.target.closest('#kosMenu, #kosStart')) kosMenu.hidden = true;
});

function tickClock() {
  kosClock.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function bootOS() {
  hideTerm();
  clearTimeout(kosBootTimer); clearInterval(kosClockTimer);
  kos.hidden = false; kosOpen = true;
  document.body.style.overflow = 'hidden';
  kosBoot.hidden = false; kosDesktop.hidden = true; kosMenu.hidden = true;
  const bar = kosBoot.querySelector('.kos-bar i');
  bar.style.animation = 'none'; void bar.offsetWidth; bar.style.animation = '';
  kosBootTimer = setTimeout(() => {
    kosBoot.hidden = true; kosDesktop.hidden = false;
    kosUser.textContent = user ? user.name : 'guest';
    tickClock();
    kosClockTimer = setInterval(tickClock, 15000);
  }, 1700);
}

function shutdownOS() {
  clearTimeout(kosBootTimer); clearInterval(kosClockTimer);
  Object.keys(kosWins).forEach(id => closeWin(id));
  kosMenu.hidden = true; kos.hidden = true; kosOpen = false;
  document.body.style.overflow = '';
}

function kosLogout() {
  user = null; guest = false;
  sessionStorage.removeItem(SESSION_KEY);
  shutdownOS();
}

/* ===== Secret terminal window (press `) ===== */
const term = document.getElementById('term');
const termBar = document.getElementById('termBar');
const termBody = document.getElementById('termBody');
const termOut = document.getElementById('termOut');
const termIn = document.getElementById('termIn');
const termPrompt = document.getElementById('termPrompt');
const termTitle = document.getElementById('termTitle');
let termPlaced = false;

function print(text) {
  const p = document.createElement('div');
  p.textContent = text;
  termOut.appendChild(p);
  termBody.scrollTop = termBody.scrollHeight;
}

// a typed command keeps its coloured prompt in the history
function printCmd(line) {
  const p = document.createElement('div');
  const ps = document.createElement('span');
  ps.className = 'ps';
  ps.textContent = termPrompt.textContent + ' ';
  p.append(ps, document.createTextNode(line));
  termOut.appendChild(p);
  termBody.scrollTop = termBody.scrollHeight;
}

function updatePrompt() {
  const who = user ? user.name : 'guest';
  termPrompt.textContent = who + '@net:~$';
  termTitle.textContent = who + '@net: ~';
}

const termAuthBox = document.getElementById('termAuth');
const tAuthName = document.getElementById('tAuthName');
const tAuthPass = document.getElementById('tAuthPass');
const tAuthMsg = document.getElementById('tAuthMsg');

// The console is locked until they log in, register or pick guest above it.
function refreshTermLock() {
  const locked = !user && !guest;
  termAuthBox.hidden = !locked;
  termIn.disabled = locked;
  termIn.placeholder = locked ? 'locked: log in first' : '';
  term.classList.toggle('locked', locked);
  updatePrompt();
}

async function termSignIn(isRegister) {
  const err = await authCore(tAuthName.value, tAuthPass.value, isRegister);
  if (err) { tAuthMsg.textContent = err; return; }
  tAuthName.value = ''; tAuthPass.value = ''; tAuthMsg.textContent = '';
  refreshTermLock();
  print((isRegister ? 'account created. ' : '') + 'logged in as ' + user.name + '. type help for commands');
  termIn.focus();
}

function showTerm() {
  term.hidden = false;
  if (!termPlaced) {
    term.style.left = Math.max(8, (innerWidth - term.offsetWidth) / 2) + 'px';
    term.style.top = Math.max(8, innerHeight * 0.15) + 'px';
    termPlaced = true;
  }
  refreshTermLock();
  if (!termIn.disabled && !termOut.children.length) print('type help for commands');
  (termIn.disabled ? tAuthName : termIn).focus();
  // The shortcut handler prevents the backtick from being typed. Do not clear
  // the username or terminal input here; preserve whatever the user entered.
}
function hideTerm() { term.hidden = true; }
const toggleTerm = () => (term.hidden ? showTerm() : hideTerm());

document.getElementById('termClose').onclick = hideTerm;
document.getElementById('tLoginBtn').onclick = () => termSignIn(false);
document.getElementById('tRegisterBtn').onclick = () => termSignIn(true);
document.getElementById('tGuestBtn').onclick = () => {
  guest = true;
  refreshTermLock();
  print('continuing as guest (progress is not saved). type help for commands');
  termIn.focus();
};
tAuthPass.addEventListener('keydown', e => { if (e.key === 'Enter') termSignIn(false); });
// Only remove the literal backtick character. Preserve every other username character.
const cleanName = () => { tAuthName.value = tAuthName.value.replace(/`/g, ''); };
tAuthName.addEventListener('beforeinput', e => {
  if (typeof e.data === 'string' && e.data.includes('`')) e.preventDefault();
});
tAuthName.addEventListener('input', e => { if (!e.isComposing) cleanName(); });
tAuthName.addEventListener('compositionend', cleanName);
termBody.addEventListener('click', () => { if (!String(getSelection())) termIn.focus(); });

// never allow backtick-type characters inside the terminal input
termIn.addEventListener('beforeinput', e => {
  if (termIn.type === 'text' && typeof e.data === 'string' && e.data.includes('`')) e.preventDefault();
});
termIn.addEventListener('input', () => {
  if (termIn.type === 'text') termIn.value = termIn.value.replace(/`/g, '');
});

/* Drag the window by its title bar */
let drag = null;
termBar.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  const r = term.getBoundingClientRect();
  drag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
  termBar.setPointerCapture(e.pointerId);
});
termBar.addEventListener('pointermove', e => {
  if (!drag) return;
  term.style.left = Math.min(Math.max(0, e.clientX - drag.dx), innerWidth - 80) + 'px';
  term.style.top = Math.min(Math.max(0, e.clientY - drag.dy), innerHeight - 40) + 'px';
});
const endDrag = () => { drag = null; };
termBar.addEventListener('pointerup', endDrag);
termBar.addEventListener('pointercancel', endDrag);

/* Open the terminal with the physical backtick key (or F2).
   Do not treat ordinary letters from other keyboard layouts as the shortcut. */
const isTermKey = e => e.code === 'Backquote' || e.keyCode === 192 || e.key === 'F2';

window.addEventListener('keydown', e => {
  if (kosOpen) {
    if (e.key === 'Escape') kosMenu.hidden = true;
    return;
  }

  if (isTermKey(e)) {
    const t = e.target;
    if (t instanceof HTMLElement && t.closest('[contenteditable="true"]')) return;
    if (t instanceof HTMLInputElement && ![termIn, tAuthName, tAuthPass].includes(t)) return;

    // Always consume the shortcut so it cannot edit the focused input.
    e.preventDefault();
    e.stopPropagation();
    e.stopImmediatePropagation();

    // If the terminal is already open and its login/command field is focused,
    // ignore the shortcut instead of closing the window and disrupting typing.
    if (!term.hidden && [termIn, tAuthName, tAuthPass].includes(t)) return;
    toggleTerm();
    return;
  }

  if (e.key === 'Escape') {
    if (!term.hidden) hideTerm();
    else if (modal.classList.contains('open')) closeModal();
  }
}, true);

/* Fallback: click the profile picture 5 times (also works on phones) */
let pfpClicks = 0, pfpTimer;
document.querySelector('.pfp').addEventListener('click', () => {
  clearTimeout(pfpTimer);
  pfpTimer = setTimeout(() => { pfpClicks = 0; }, 2000);
  if (++pfpClicks >= 5) { pfpClicks = 0; toggleTerm(); }
});

/* ===== whoami helpers ===== */
function deviceInfo() {
  const ua = navigator.userAgent;
  let os = 'unknown OS';
  if (/CrOS/.test(ua)) os = 'ChromeOS';
  else if (/Windows/.test(ua)) os = 'Windows';
  else if (/Android/.test(ua)) os = 'Android';
  else if (/iPhone|iPad|iPod/.test(ua)) os = 'iOS';
  else if (/Mac OS X|Macintosh/.test(ua)) os = 'macOS';
  else if (/Linux/.test(ua)) os = 'Linux';

  let browser = 'unknown browser';
  if (/Edg\//.test(ua)) browser = 'Edge';
  else if (/OPR\/|Opera/.test(ua)) browser = 'Opera';
  else if (/Firefox\//.test(ua)) browser = 'Firefox';
  else if (/Chrome\//.test(ua)) browser = 'Chrome';
  else if (/Safari\//.test(ua)) browser = 'Safari';

  const tablet = /iPad|Tablet/.test(ua) || (/Android/.test(ua) && !/Mobile/.test(ua));
  const phone = !tablet && /Mobi|iPhone|Android/.test(ua);
  return os + ' ' + (tablet ? 'tablet' : phone ? 'phone' : 'computer') + ', ' + browser;
}

async function getJSON(url) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 5000);
  try {
    const r = await fetch(url, { signal: ctl.signal });
    return await r.json();
  } finally { clearTimeout(timer); }
}

// The lookup runs in the visitor's own browser and the result is only
// printed in their terminal. Nothing is stored or sent to this site.
async function lookupIP() {
  try {
    const d = await getJSON('https://ipwho.is/');
    if (d && d.success !== false && d.ip) return { ip: d.ip, country: d.country || null };
  } catch {}
  try {
    const d = await getJSON('https://api.ipify.org?format=json');
    if (d && d.ip) return { ip: d.ip, country: null };
  } catch {}
  return { ip: null, country: null };
}

/* ===== Shell ===== */
termIn.addEventListener('keydown', async e => {
  if (e.key !== 'Enter') return;
  const line = termIn.value.trim();
  termIn.value = '';
  if (!line) return;
  printCmd(line);
  await runCommand(line);
});

async function runCommand(line) {
  const cmd = line.toLowerCase();

  if (cmd === SECRET_CODE) { bootOS(); return; }

  if (cmd === 'help') { print('commands: help, whoami'); return; }

  if (cmd === 'whoami') {
    print('youare "' + (user ? user.name : 'guest') + '"');
    const info = await lookupIP();
    print('ip address: ' + (info.ip || 'unavailable'));
    print('device: ' + deviceInfo());
    print('country: ' + (info.country || 'unavailable'));
    return;
  }

  print(cmd.split(/\s+/)[0] + ': command not found');
}
